    "Que pasa si la sociedad no tiene Tax ID? Puedo reportarlo con el Nit 444?": {
      "2021": "",
      "2022": "",
      "2023": "Se reporta con el NIT 444444XXX cuando no es posible asignar un TAX ID ejemplo Departamento del Tesoro de Estados unidos",
      "2024": "Se reporta con el NIT 444444XXX cuando no es posible asignar un TAX ID ejemplo Departamento del Tesoro de Estados unidos",
      "2025": "Según concepto tributario de Gobierno corporativo el cual esta alineado con la Guía de Operación de Datos maestros, se crearon los casos de la Filial USA con el siguiente consecutivo.\n\n \n\n“Frente a solicitudes especiales de entes internacionales que no presente número de identificación Fiscal o TX ID, según directriz del área tributaria se debe identificar el consecutivo interno para el efecto de información exógena que ECOPETROL S.A., trasmite a la DIAN. Este consecutivo de TX ID es 44444XXXX “\n\n \n\n \n\nFavor tomar el ID 444447001 y variando consecutivamente en una unidad.",
      "corporativo": "\nCordial saludo. Mediante el presente correo le informamos que el funcionario GAT dió respuesta a su solicitud de Concepto Tributario con consecutivo 2025-GAT-2476, en los siguientes términos: Buenos días,\n\nA continuación encontrarás nuestro análisis y conclusiones en relación con la asignación de un código a las sociedades del exterior en ausencia de un TAX ID:\n\n\nDe acuerdo con el PARÁGRAFO 6º del ARTÍCULO 20 de la RESOLUCIÓN 162 DE 2023, “Para los pagos o abonos en cuenta efectuados a entidades o sociedades del exterior, al reportar el número de identificación se debe diligenciar con el número, código o clave de identificación, tal como figura en el registro fiscal tributario del país de residencia o domicilio y tipo de documento 42. Cuando en dicho país no se utilice número, código o clave fiscal, se debe informar con identificación 444444001 en forma ascendente, variando consecutivamente en una unidad hasta el 444449999 y con tipo de documento 43. Los campos de dirección, departamento y municipio no se deben registrar.\n\nPara los pagos o abonos en cuenta efectuados a personas naturales del exterior, al reportar el número de identificación se debe diligenciar con el número, código o clave de identificación registrado en el país de residencia o domicilio fiscal. Cuando se diligencie con tipo de documento 42, los campos de dirección, departamento y municipio no se deben registrar.”\n\nEn conclusión, para efectos de medios magnéticos se deberá asignar un código según lo indicado.",
      "link": "https://ecopetrol.sharepoint.com/:u:/r/sites/DirectricesExogena/Documentos%20compartidos/Directrices/6.Novedades%20Datos%20Maestros/En%20ausencia%20de%20un%20TAX%20ID.msg?csf=1&web=1&e=UFoN42\nhttps://ecopetrol.sharepoint.com/:f:/r/sites/DirectricesExogena/Documentos%20compartidos/Directrices/6.Novedades%20Datos%20Maestros/Nit%204444%20Memorando%20y%20excepciones?csf=1&web=1&e=pA8pOO"
    },
    "Cómo se debe reportar los terceros del exterior?": {
      "2021": "",
      "2022": "Se deben reportar con el Tax ID, se solicita el cambio de todos los Nits 444444XXXX por el Tax ID, solo se deja de excepción entidades Gubernamentales de Estados unidos que no tienen Tax ID\n1. Proveedores\n De los 63 proveedores de Ecopetrol con NIT 4XXXXXX se identificaron cuales han tenido movimiento de 01.01.2019 a la fecha.\n Del ejercicio anterior se encontraron 15 proveedores con movimiento de los cuales 14 ya fueron actualizados con el Tax ID correspondiente.\n Se dio petición de borrado y bloqueo a 49 terceros que no han tenido movimiento desde 01.01.2019.\n2. Deudores\n De los 114 Deudores de Ecopetrol con NIT 4XXXXXX se identificaron cuales han tenido movimiento de 01.01.2019 a la fecha.\n Del ejercicio anterior se encontraron 3 Deudores con movimiento de los cuales 2 ya fueron actualizados con el Tax ID correspondiente\n Se dio petición de borrado a 111 terceros que no han tenido movimiento desde el 01.01.2019\nTanto en acreedores como en deudores, a la fecha no hay terceros activos que tengan Nit genérico 444XXXXX.",
      "2023": "Se deben reportar con el Tax ID, se solicita el cambio de todos los Nits 444444XXXX por el Tax ID, solo se deja de excepción entidades Gubernamentales de Estados unidos que no tienen Tax ID\n1. Proveedores\n De los 63 proveedores de Ecopetrol con NIT 4XXXXXX se identificaron cuales han tenido movimiento de 01.01.2019 a la fecha.\n Del ejercicio anterior se encontraron 15 proveedores con movimiento de los cuales 14 ya fueron actualizados con el Tax ID correspondiente.\n Se dio petición de borrado y bloqueo a 49 terceros que no han tenido movimiento desde 01.01.2019.\n2. Deudores\n De los 114 Deudores de Ecopetrol con NIT 4XXXXXX se identificaron cuales han tenido movimiento de 01.01.2019 a la fecha.\n Del ejercicio anterior se encontraron 3 Deudores con movimiento de los cuales 2 ya fueron actualizados con el Tax ID correspondiente\n Se dio petición de borrado a 111 terceros que no han tenido movimiento desde el 01.01.2019\nTanto en acreedores como en deudores, a la fecha no hay terceros activos que tengan Nit genérico 444XXXXX.",
      "2024": "Se deben reportar con el Tax ID, se solicita el cambio de todos los Nits 444444XXXX por el Tax ID, solo se deja de excepción entidades Gubernamentales de Estados unidos que no tienen Tax ID",
      "2025": "Se deben reportar con el Tax ID, se solicita el cambio de todos los Nits 444444XXXX por el Tax ID, solo se deja de excepción entidades Gubernamentales de Estados unidos que no tienen Tax ID",
      "corporativo": "Atendiendo comunicado recibido por parte de la DIAN, relacionado con el\nuso de los NITS genéricos códigos 444444001 al 444449999,- ver anexo\n1- se requiere la depuración de los datos maestros de Ecopetrol y Refinería\nde Cartagena S.A, creados con estos terceros y se identifique el TAX ID y\nel país al cual pertenece.\nCon base en lo anterior, se solicita realizar las acciones de revisión y/o\nmodificación en la maestra de terceros de Ecopetrol de tal forma que:\n- Se eliminen los NITS genéricos (444*) en los datos maestros de terceros\n- En adelante la creación de terceros del exterior se realice con el TAX ID\nque le corresponda de acuerdo con el país de origen\n- Una vez realizados los cambios antes mencionados, realizar la\ncorrección contable que corresponda de tal forma que la información a\nreportar esté identificada con el tercero correcto.\nCabe indicar que la correcta identificación del tercero - NIT y demás\ninformación es un dato obligatorio exigido por la DIAN y otros informes de\ncarácter oficial, que al reportarse de manera errada se encuentra sujeto a\nsanción con base en lo estipulado en el artículo 651 del estatuto tributario.\nDocuSign Envelope ID: E482AA11-CBB4-41D2-B9B8-0982BE13E9D7\nPor lo anterior, se solicita que las acciones antes señaladas se realicen\nprevio cierre de los Estados Financieros del año 2021, a fin de evitar\nsanciones en los términos señalados anteriormente.",
      "link": "https://ecopetrol.sharepoint.com/:f:/r/sites/DirectricesExogena/Documentos%20compartidos/Directrices/6.Novedades%20Datos%20Maestros/Nit%204444%20Memorando%20y%20excepciones?csf=1&web=1&e=eWirXH"
    },
    "Cómo debo reportar a un proveedor de salud extranjero? Su cuenta bancaria esta con cédula de extranjeria y para exógena tiene NIT?": {
      "2021": "",
      "2022": "",
      "2023": "",
      "2024": "Se debe reportar con el Nit y realizar los registros con el Nit",
      "2025": "Se debe reportar con el Nit y realizar los registros con el Nit",
      "corporativo": "From:\tDatamaestra <Datamaestra@ecopetrol.com.co>\nSent on:\tTuesday, September 6, 2022 1:10:39 PM\nTo:\tXiomara Villamizar Peña <Xiomara.Villamizar@ecopetrol.com.co>; Alihet Quijano Garzon <Alihet.Quijano@ecopetrol.com.co>; Dora Alexi Lancheros Benitez <dora.lancheros@ecopetrol.com.co>; Jenny Carolina Rodriguez Uricoechea <jennyca.rodriguez@ecopetrol.com.co>; Sandra Elizabeth Orjuela Rozo <Sandra.Orjuela@ecopetrol.com.co>; Mauricio Ferreira Rodriguez <mauricio.ferreira@ecopetrol.com.co>; Olga Lucia Bulla Rodriguez <olga.bulla@ecopetrol.com.co>\nCC:\tLuz Yaneth Carrillo Avila <Luz.Carrillo@ecopetrol.com.co>\nSubject:\tRV: Proveedores extranjero salud - consulta DIAN - alternativas\nAttachments:\tRV Respuesta. Consulta No. 202282140100087769.msg (510.5 KB)\n \t \n\nBuen día\n\nDando alcance al mensaje antecesor con la respuesta de la DIAN al área Tributaria, Ecopetrol debe reportar al proveedor con el número de NIT. Por lo tanto, solo para efectos del pago (cuando el banco crea la cuenta al proveedor con cédula y no con NIT), la opción habilitada es crear al proveedor identificado con cédula, como Receptor alter.pago, con lo anterior, cuando el proveedor reporte sus ingresos estos serán los mismos que Ecopetrol reportará a la DIAN.\n\nCordial saludo\n\nGrupo Maestra de Datos\n\nDepartamento de Producción de Información",
      "link": "https://ecopetrol.sharepoint.com/:u:/r/sites/DirectricesExogena/Documentos%20compartidos/Directrices/6.Novedades%20Datos%20Maestros/RV_%20Proveedores%20extranjero%20salud%20-%20consulta%20DIAN%20-%20alternativas.msg?csf=1&web=1&e=R5F1uK"
    },
    "Cómo debo reportar a las personas naturales del Exterior?": {
      "2021": "",
      "2022": "",
      "2023": "",
      "2024": "Se reportan con el Nit creado en el RUT y asi se envión directriz a Datos Maestros acorde respuesta DIAN",
      "2025": "Se reportan con el Nit creado en el RUT y asi se envión directriz a Datos Maestros acorde respuesta DIAN",
      "corporativo": "ASUNTO: 20220903 100175447 – 04305 Respuesta al PQRS 202282140100087769\nBogotá, 03 de Septiembre de 2022\nCorreo electrónico solicitud / RUT : ecptributaria@ecopetrol.com.co\nEn atención a la solicitud de información PQRS radicada bajo el número PQRS 202282140100087769 del\n28/07/2022, se aclara que si el tercero a reportar es una persona natural de origen extranjero que por la naturaleza\nde sus operaciones comerciales o profesionales en Colombia tiene un NIT asignado, este será el documento con el que deberá ser reportado.\nSe informa que para diligenciar la casilla de tipo de documento del tercero, se deben utilizar las siguientes\nCódigos para los Tipos de documento habilitados por la DIAN:\n11 Registro civil de nacimiento\n12 Tarjeta de identidad\n13 Cédula de ciudadanía\n21 Tarjeta de extranjería\n22 Cédula de extranjería\n31 NIT\n41 Pasaporte\n42 Tipo de documento extranjero\n47 Permiso Especial de Permanencia\n43 Sin identificación del exterior o para uso definido por la DIAN.\nSe recuerda que el RUT es un mecanismo utilizado por la Dian que tiene como función principal identificar las obligaciones tributarias de\ncada contribuyente. se precisa que una persona natural no residente colombiano o extranjero tendrá la obligación de inscribirse en el\nRUT si queda obligado de declarar renta, un extranjero está obligado a declarar renta en Colombia, sea residente fiscal o\nno, cuando cumple los topes o requisitos para estar obligado a declarar renta aplicable a los colombianos de\nnacimiento y que sobre dichos ingresos no se hayan efectuado las retenciones establecidas en los artículos 407 a 411 del Estatuto\nTributario.",
      "link": "https://ecopetrol.sharepoint.com/:u:/r/sites/DirectricesExogena/Documentos%20compartidos/Directrices/6.Novedades%20Datos%20Maestros/Terceros%20del%20exterior%20que%20tienen%20Nit%20en%20Colombia.msg?csf=1&web=1&e=LG5gnL\nhttps://ecopetrol.sharepoint.com/:u:/r/sites/DirectricesExogena/Documentos%20compartidos/Directrices/6.Novedades%20Datos%20Maestros/Persona%20naturales%20extranjeras_%20DIAN%20Consulta_%20202282140100087769.msg?csf=1&web=1&e=pibbzD"
    }
  },
  "Ingresos-Concepto 4017-Ingresos extraordinarios Vs Renglon 70 de renta": {
    "¿Cómo se reportan los valores que se identifiquen como recuperaciones de gastos, cuya deducción se haya tomado en el año o años anteriores al corriente? Esto con el propósito de solo reclasificar al renglón 70 – “Renta por recuperación de deducciones de renta” y reportar en el concepto 4017 – “Ingresos por recuperaciones de costos y deducciones que constituyen renta líquida. Arts.195 a 198 E.T.”. del formato 1007, lo que en la contabilidad fiscal se refleje como un ingreso por recuperaciones.": {
      "2021": "",
      "2022": "",
      "2023": "",
      "2024": "1.\tReclasificar al renglón 70 (renta por recuperación de deducciones-rentas especiales) los valores que corresponden a reintegros de convenios y recuperación de provisiones, considerando que fueron valores deducidos en periodos anteriores y en 2024 se reconoció su recuperación. Este análisis debe venir previamente realizado por el profesional que tenga a cargo las cuentas de ingresos. Si se identifican nuevas cuentas o conceptos que cumplan con las condiciones, también se deberán analizar y reclasificar.\n2.\tSe analizó que las recuperaciones de gastos ocurridas dentro de la misma vigencia fiscal no deberían corresponder a una renta liquida especial por recuperación de deducciones, porque precisamente la deducción se tomaría en 2024 disminuida con el valor recuperado. Si se identifican recuperaciones de deducciones tomadas en vigencias anteriores, se debe solicitar el ajuste en el libro fiscal. Este análisis debe realizarlo el profesional(es) que tenga (n) a cargo cuentas del gasto/costo en donde se identifique esta situación ",
      "2025": "Se reportan en el conceptop 4017 las recupereaciones identificadas en el renglon 70 quedando como partida conciliatoria con ingresos los recobros realizados que se llevan como menor valor del costo o gasto",
      "corporativo": "Las recuperaciones de costos y gastos de años anteriores se deben reconocer en el renglón 70 – Renta por recuperación de deducciones – de la declaración de renta. Esto conlleva que este ingreso no este sometido a las autorretenciones por otros ingresos ni a la autorretención especial. Ingresos por recuperaciones de costos y deducciones que constituyen renta líquida. Arts.195 a 198 E.T. Las transacciones donde no se identifique un tercero informado se deben reportar con el NIT del informante.",
      "link": "https://ecopetrol.sharepoint.com/:f:/r/sites/DirectricesExogena/Documentos%20compartidos/Directrices/7.Ingresos?csf=1&web=1&e=dkgjhE"
    }
  },
  "Iva": {
    "Cómo debo reportar el Iva-Proporción Iva rechazado?": {
      "2021": "",
      "2022": "",
      "2023": "",
      "2024": "Se debe reportar en el formato 1005 en la columna Valor el valor del IVA descontable y en el Iva No deducible el Valor del Iva rechazado, las uma de estas dos columnas debe ser el valor total del IVA por tercero, En Penta se debe realizar la distribucón acorde al análisis de la declartación de IVA y anexos de devolución de IVA, en el Formato 1001 se reporta el gasto con el NIT de Ecopetrol",
      "2025": "Se debe reportar en el formato 1005 en la columna Valor el valor del IVA descontable y en el Iva No deducible el Valor del Iva rechazado, las uma de estas dos columnas debe ser el valor total del IVA por tercero, En Penta se debe realizar la distribucón acorde al análisis de la declartación de IVA y anexos de devolución de IVA, en el Formato 1001 se reporta el gasto con el NIT de Ecopetrol",
      "corporativo": "el formato 1005 en cuanto a reportar en una columna el valor del IVA descontable que cruce con declaración de IVA y en otra columna reportar el IVA rechazado producto del cálculo de la proporcionalidad.\n\n \n\nAgradecemos realizar una sesión para detallar el procedimiento a seguir y definir la necesidad de crear un concepto adicional en Penta, fuente de información, estructura de archivo plano a cargar, etc.\n\n ",
      "link": "https://ecopetrol.sharepoint.com/:f:/r/sites/DirectricesExogena/Documentos%20compartidos/Directrices/8.Iva?csf=1&web=1&e=XhIN02"
    },
    "Como se debe analizar el Joint Venture y Grupo de Participación en el IVA de ASOC?": {
      "2021": "Se genera la información desde PENTA y se buscan los campos vacios en las columnas JV y GR y se busca por numero de documento en la transaccion GJ_GD20 y se realiza un buscar V por documento",
      "2022": "Se genera la información desde PENTA y se buscan los campos vacios en las columnas JV y GR y se busca por numero de documento en la transaccion GJ_GD20 y se realiza un buscar V por documento",
      "2023": "Se genera la información desde PENTA y se buscan los campos vacios en las columnas JV y GR y se busca por numero de documento en la transaccion GJ_GD20 y se realiza un buscar V por documento",
      "2024": "Se genera la transacción ZFIMOVIMIENTOS_DIA, se buscan los JV y GR por cada documento y se realiza plano en penta ",
      "2025": "Procedimiento actualizado\n1.\tRegistros ya tercerizados (JV y GRP):\nNo será necesario realizar control adicional, siempre que las columnas JV y GRP se encuentren correctamente diligenciadas en Penta.\n2.\tRegistros no tercerizados (sin JV ni GRP):\n•\tSe deberá verificar mediante la consulta de SAP “GJ_GD20 - JVA y posiciones de facturación JV” si los registros a reportar presentan más de un tercero asociado.\n•\tEn caso afirmativo, será necesario abrir el registro y reportar los valores correspondientes por tercero.\n•\tEsta actividad deberá ser creada y documentada en VProject.\n3.\tRegistros sin tercerización posterior a la verificación anterior:\nContinuar con el procedimiento previamente establecido:\n•\tMediante la consulta “ZFI_ASIENTOS_DIA”, identificar el JV y GRP correspondientes.\n•\tTercerizar tomando como referencia el primer registro que contenga dichos valores.\n4.\tRegistros repetidos:\nDeberán unificarse, garantizando siempre la exactitud del valor reportado.\n5.\tEvidencia en PT de mandatos:\nCada PT deberá incluir evidencia del cruce y control con la consulta GJ_GD20.\nEn caso de aplicar, se debe anexar también el detalle de la consulta T8JQ, evidenciando si existen múltiples terceros por JV.\n(Esta actividad también debe ser registrada en VProject).\n\n-\tConclusiones finales:\nEste procedimiento entra en vigencia de inmediato y busca consolidar una práctica de mejora continua dentro del proceso de control y validación de formatos de mandatos.\nEs fundamental que el equipo responsable de los formatos por parte del cliente incorpore estas verificaciones dentro de su revisión final, garantizando así la integridad y consistencia de la información reportada.",
      "corporativo": "De acuerdo con lo conversado en la reunión del 15 de octubre de 2025, sobre el tema “Exógena – Formato IVA Descontable – Asoc”, se definió y aprobó una nueva directriz orientada a fortalecer los controles y optimizar el manejo de los registros JV y GRP dentro de Penta.\nEste ajuste busca mejorar la trazabilidad, consistencia y calidad de la información reportada. A continuación, se detallan los lineamientos acordados:\n\nProcedimiento actualizado\n1.\tRegistros ya tercerizados (JV y GRP):\nNo será necesario realizar control adicional, siempre que las columnas JV y GRP se encuentren correctamente diligenciadas en Penta.\n2.\tRegistros no tercerizados (sin JV ni GRP):\n•\tSe deberá verificar mediante la consulta de SAP “GJ_GD20 - JVA y posiciones de facturación JV” si los registros a reportar presentan más de un tercero asociado.\n•\tEn caso afirmativo, será necesario abrir el registro y reportar los valores correspondientes por tercero.\n•\tEsta actividad deberá ser creada y documentada en VProject.\n3.\tRegistros sin tercerización posterior a la verificación anterior:\nContinuar con el procedimiento previamente establecido:\n•\tMediante la consulta “ZFI_ASIENTOS_DIA”, identificar el JV y GRP correspondientes.\n•\tTercerizar tomando como referencia el primer registro que contenga dichos valores.\n4.\tRegistros repetidos:\nDeberán unificarse, garantizando siempre la exactitud del valor reportado.\n5.\tEvidencia en PT de mandatos:\nCada PT deberá incluir evidencia del cruce y control con la consulta GJ_GD20.\nEn caso de aplicar, se debe anexar también el detalle de la consulta T8JQ, evidenciando si existen múltiples terceros por JV.\n(Esta actividad también debe ser registrada en VProject).\n\n-\tConclusiones finales:\nEste procedimiento entra en vigencia de inmediato y busca consolidar una práctica de mejora continua dentro del proceso de control y validación de formatos de mandatos.\nEs fundamental que el equipo responsable de los formatos por parte del cliente incorpore estas verificaciones dentro de su revisión final, garantizando así la integridad y consistencia de la información reportada.\n",
      "link": "https://ecopetrol.sharepoint.com/:u:/r/sites/DirectricesExogena/Documentos%20compartidos/Directrices/8.Iva/ECP-Exogena-2025-Implementaci%C3%B3n-Nueva-Directriz%E2%80%93Procedimiento%20de%20control%20y%20verificaci%C3%B3n%20JV%20y%20GRP.msg?csf=1&web=1&e=Q4O8nK"
    }
  },

    "Cuál es el tratamiento del subgrupo FSEM-EMRF puente?": {

  "BOMTS IFRS": {
    "BOMTS IFRS": {
      "2021": "Se reporta como esta en la contabilidad, la información detallada por tercero la envian desde Contabilidad.",
      "2022": "Se reporta como esta en la contabilidad, la información detallada por tercero la envian desde Contabilidad.",
      "2023": "Se reporta como esta en la contabilidad, la información detallada por tercero la envian desde Contabilidad.",
      "2024": "Se reporta como esta en la contabilidad, la información detallada por tercero la envian desde Contabilidad.La información actualmente la envia Carlos Andres Cruz Prieto <carlos.cruz@ecopetrol.com.co>",
      "2025": "Se reporta como esta en la contabilidad, la información detallada por tercero la envian desde Contabilidad.La información actualmente la envia Carlos Andres Cruz Prieto <carlos.cruz@ecopetrol.com.co>",
      "corporativo": "\nAgenda\n\nPresentación de la solicitud recibida por parte del Señor Omar Quintín indicando que la información reportada no coincidía con su realidad, toda vez que se reportó un pasivo por arrendamiento financiero (Contabilidad) y el tercero indica que Ecopetrol no le debe.\nExplicación por parte de Carlo del registro contable\nAnálisis del conjunto del caso\n\nNotas de la reunión\n\nSe analizaron las diferentes posiciones para las personas naturales pero se evidencia que reportar de manera fraccionada se hace más complejo el proceso de revisión y elaboración.\nCon base en lo revisado y con el fin de evitar inconsistencias en la información a reportar se mantiene la posición de reportar lo que tenemos registrado en la contabilidad \nEn el caso de llegar requerimientos por parte de personas naturales se sigue respondiendo de la misma manera: (Formato de respuesta enviada a la consulta del Señor Omar Quintin)\nAtendiendo su solicitud y conforme con la revisión realizada con la Coordinación de Operación Tributaria de Ecopetrol, se evidencia que la información reportada durante el año gravable 2023 corresponde a los saldos reconocidos por la compañía en sus Estados Financieros. Se adjunta detalle del valor reportado por Ecopetrol S.A indicando el concepto de este.\nEl pasivo reportado es una proyección de la obligación que tenemos con usted durante todas las vigencias del contrato y el mismo se ira agotando en la medida que se facture el pasivo real en periodos futuros (IFR16)\nNo obstante lo anterior, es de anotar que la información disponible en la información exógena de la DIAN es informativa y los contribuyentes deben preparar sus declaraciones tributarias con base en la realidad de sus ingresos, costos, gastos, pasivos y activos.",
      "link": "https://ecopetrol.sharepoint.com/:f:/r/sites/DirectricesExogena/Documentos%20compartidos/Directrices/18.%20IFRS%2016/BOMT?csf=1&web=1&e=k0BqpP"
    }
  },
  "Grupo Empresarial": {
    "Se debe reportar la participación de cada una de las filiales incluyendo los contrato de asociación?Formato 1035-1036": {
      "2021": "Se reportaba solo Ecopetrol sin distribuir JV",
      "2022": "Se reportaba solo Ecopetrol sin distribuir JV",
      "2023": "Se reporta el procentaje de participación de cada una de las sociedades del Grupo Empresarial, se incluyen los % de partcpación en contratos de Join Venture en Ecopetrol. Para las demas sociedad se reporto el 1034 y 1035 con la participación de Ecopetrol al 100%",
      "2024": "Se reporta el procentaje de participación de cada una de las sociedades del Grupo Empresarial, se incluyen los % de partcipación en contratos de Join Venture en Ecopetrol, esta información se toma de las notas a los estados financieros incluyendo los Join Venture, en este ultimo caso se reporta al participante con mayor porcentaje. Para las compañías diferentes a Ecopetrol, reportar las que tienen participación de forma directa o indirecta en el capital de alguna compañía del Grupo Empresarial, sin importar si se tiene o no control sobre las mismas.Tener presente que no se debe reportar la matriz o controlante nacional.",
      "2025": "Se reporta el procentaje de participación de cada una de las sociedades del Grupo Empresarial, se incluyen los % de partcipación en contratos de Join Venture en Ecopetrol, esta información se toma de las notas a los estados financieros incluyendo los Join Venture, en este ultimo caso se reporta al participante con mayor porcentaje. Para las compañías diferentes a Ecopetrol, reportar las que tienen participación de forma directa o indirecta en el capital de alguna compañía del Grupo Empresarial, sin importar si se tiene o no control sobre las mismas.Tener presente que no se debe reportar la matriz o controlante nacional.",
      "corporativo": "Estimados, buenos días \n\nDamos alcance al correo  precedente en los siguientes terminos:\n\n1.\tSe comparte comunicado recibido por la DIAN como respuesta a la consulta realizada por Ecopetrol, relacionadas con los formatos 1035 y 1036.\n\nCon base en lo ahí mencionado para la  elaboración de los formatos, se debe tener en cuenta lo siguiente:\n \n1.\tSe deben reportar todas las compañías con las cuales se tenga algún porcentaje de participación en el capital, para lo cual tener en cuenta la información compartida de la participación accionaria \n\no\tPara Ecopetrol se reportan todas las empresas, ya que posee capital directa o indirectamente. \no\tPara las compañías diferentes a Ecopetrol, reportar las que tienen participación de forma directa o indirecta en el capital de alguna compañía del Grupo Empresarial, sin importar si se tiene o no control sobre las mismas.\no\tTener presente que no se debe reportar la matriz o controlante nacional.\n \n2.\tPara las empresas diferentes a Ecopetrol, se deben reportar también las sociedades que hacen parte del Grupo Empresarial con las cuales se tuvieron operaciones durante el año 2024. \nPara ello, por favor identificar las sociedades que hacen parte del Grupo Empresarial en los formatos de la exógena (pagos/ingresos/cxp/cxc…) y que no fueron reportadas en el primer numeral de este correo.  Estas sociedades se deben reportar con porcentaje de participación de cero (0%).\n \n3.\tPara los contratos de Colaboración, si hay varios contratos con un mismo tercero, se reporta el contrato con porcentaje de participación mayor. \nEn caso de tener alguna parte variable en la participación, se reporta solo el porcentaje de participación que es fijo. (Esa interpretación se da bajo el entendimiendo que hoy se tiene de la norma, sin embargo se esta buscando un acercamiento con la DIAN para obtener mayores precisiones al respecto)\n \n   4. El formato solo permite reportar a cada tercero una vez, es decir, si con un mismo tercero se tiene participación en el capital y contrato de participación solo se debe reportar el tercero con la participación en el capital.  \n\n•\tEn el formato 1035 no se debe reportar a su matriz o controlante.\n•\tLos vinculados económicos se deben reportar como “control indirecto” no obstante no se tenga control.\n•\tSe deben reportar los contratos de asociación que tenga cada compañía.\n•\tEn la casilla Tipo de informante tener en cuenta: (i) Si se tiene participación accionaria en la compañía a reportar, el tipo de informante corresponde con la calidad que tenga la empresa ejm (3 Filial, 4 subsidiaria) (ii) si no se tiene participación accionaria sobre la compañía a reportar, el tipo de informante debe ser (5demás subordinadas o vinculados económicos).\n•\tEn la casilla tipo de vinculación tener en cuenta (i) Si se tiene participación accionaria en la compañía a reportar, escoger (1 subordinación) (ii) si no se tiene participación accionaria sobre la compañía a reportar, escoger (2 otras formas de vinculación)\n•\tEn el porcentaje de participación colocar Cero “0” y si aparece error dejarlo en blanco\nEn archivo adjunto enviamos formatos 1035 y 1036 que reportará Ecopetrol con el fin que sean tomados como guía para sus reportes.",
      "link": "https://ecopetrol.sharepoint.com/:f:/r/sites/DirectricesExogena/Documentos%20compartidos/Directrices/17.%20Directriz%20Formatos%201035%20y%201036?csf=1&web=1&e=dzb9hd"
    }
  },

    "En el formato 1004 en el concepto 8331 (Iva descuento Activos Fijos reales productivos), en la columna Valor pagado, ¿debería ir el valor del IVA pagado? o, ¿debe ir el valor total de la factura?": {

      "corporativo": "el formato 1004 se debe incluir el valor efectivamente pagado que fue imputado como descuento tributario en la declaración de renta del año gravable 2021; por ende, si por alguna razón, parte del IVA, bien sea porque no se ha pagado o por decisión gerencial, no se incluyó como descuento y permanecerá reconocido como parte del activo de Ecopetrol, este no se deberá reportar dentro del formato 1004.\nSiguiendo con los lineamientos de lo dispuesto en el artículo 258 del E.T y la regulación para el reporte de medios magnéticos, nótese que la información a reportar en el formato 1004 de medios magnéticos corresponde a “Descuentos Tributarios solicitados”, por lo tanto, dentro del concepto 8331 del formato 1004 se debe reportar la cifra que efectivamente este siendo incluida como descuento tributario en la declaración de renta, por lo que no necesariamente coincidiría con el IVA que ha sido pagado a la fecha por este concepto, siendo el valor del activo superior al descuento, o con las facturas que han sido recibidas por la adquisición de este tipo de bienes.\nEn este caso, es menester señalar que el formato 1004 busca un cruce directo con la información de la declaración de renta y validar la información a reportar por este concepto, por lo que pueden generarse partidas diferenciales que deben mantenerse conciliadas, considerando que los valores remanentes en el activo serán objeto de descuento tributario en periodos futuros y en consecuencia, serán reportados en formatos de información exógena siguientes, cuando estos sean utilizados.",

<h2>¿Sobre qué tema quieres preguntar?</h2>
<select id="temaSelect" onchange="loadPreguntas()">
<option value="">-- Selecciona un tema --</option>
</select>
<h2>Selecciona la pregunta</h2>
<select id="preguntaSelect" onchange="mostrarRespuesta()">
<option value="">-- Selecciona una pregunta --</option>
</select>
<div class="response-box" id="respuestaContainer"></div>
<button onclick="elevarConsulta()">No encontré mi pregunta, elevar consulta</button>
<script>
function loadTemas() {
    const temaSelect = document.getElementById('temaSelect');
    for (let tema in chatbotData) {
        let option = document.createElement('option');
        option.value = tema;
        option.textContent = tema;
        temaSelect.appendChild(option);
    }
}

function loadPreguntas() {
    const tema = document.getElementById('temaSelect').value;
    const preguntaSelect = document.getElementById('preguntaSelect');
    preguntaSelect.innerHTML = '<option value="">-- Selecciona una pregunta --</option>';
    if (tema && chatbotData[tema]) {
        for (let pregunta in chatbotData[tema]) {
            let option = document.createElement('option');
            option.value = pregunta;
            option.textContent = pregunta;
            preguntaSelect.appendChild(option);
        }
    }
    document.getElementById('respuestaContainer').innerHTML = '';
}

function mostrarRespuesta() {
    const tema = document.getElementById('temaSelect').value;
    const pregunta = document.getElementById('preguntaSelect').value;
    const container = document.getElementById('respuestaContainer');
    if (tema && pregunta && chatbotData[tema][pregunta]) {
        const data = chatbotData[tema][pregunta];
        container.innerHTML = `
            <strong>Respuesta por año:</strong><br>
            <b>2021:</b> ${data['2021']}<br>
            <b>2022:</b> ${data['2022']}<br>
            <b>2023:</b> ${data['2023']}<br>
            <b>2024:</b> ${data['2024']}<br>
            <b>2025:</b> ${data['2025']}<br><br>
            <strong>Directriz Corporativa:</strong><br>${data['corporativo']}<br><br>
            <strong>Link de soporte:</strong><br><a href="${data['link']}" target="_blank">${data['link']}</a>
        `;
    } else {
        container.innerHTML = '';
    }
}

function elevarConsulta() {
    const mailto = "mailto:walter.castro@ecopetrol.com.co?cc=adalbert.palacios@ecopetrol.com.co;sandra.bulla@ecopetrol.com.co;diana.espinosa@ecopetrol.com.co;jennyca.rodriguez@ecopetrol.com.co&subject=Consulta Directriz Exógena&body=No encontré mi pregunta en el chatbot. Por favor ayúdame.";
    window.location.href = mailto;
}

window.onload = loadTemas;
</script>
</body></html>
